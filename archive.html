    <script>
        const posts = [
            { title:"一篇文章带你了解“格雷码”", excerpt:"格雷码是一种相邻数仅有一位不同的二进制编码，由Frank Gray于1940年代提出。文章介绍了两种构造方法：手动翻转法和镜像构造法，并给出转换公式G(n)=n⊕⌊n/2⌋及其证明。同时解释了如何从格雷码还原原数。格雷码在超立方体路径规划、数模转换误差优化、汉诺塔问题求解及遗传算法中都有重要应用，特别是能通过每次只改变一位的特性高效解决汉诺塔问题。", date:"2026-08-30", category:"算法", tags:["Java","算法", "开发语言"], wordCount:1390, image:"images/archive1.png", href:"https://blog-kgyr3427.gt.tc/archive/2026-08-30_21:26.html" }
        ];
        function renderArchive() {
            const container = document.getElementById('archiveContent');
            const sorted = [...posts].sort((a, b) => new Date(b.date) - new Date(a.date));
            const grouped = {};
            sorted.forEach(post => {
                const year = post.date.split('-')[0];
                if (!grouped[year]) grouped[year] = [];
                grouped[year].push(post);
            });
            let html = '';
            Object.keys(grouped).sort().reverse().forEach(year => {
                const yearPosts = grouped[year];
                html += `
                    <div class="archive-year fade-in">
                        <h2 class="archive-year-title">${year} <span class="archive-year-count">（${yearPosts.length} 篇）</span></h2>
                        <div class="archive-timeline">
                `;
                yearPosts.forEach((post, i) => {
                    const dateStr = post.date.substring(5);
                    html += `
                        <article class="archive-item fade-in" style="transition-delay:${i * 0.05}s">
                            <div class="archive-item-header">
                                <span class="archive-date">${dateStr}</span>
                                <a href="${post.href}" class="archive-title">${post.title}</a>
                            </div>
                            <p class="archive-excerpt">${post.excerpt}</p>
                            <div class="archive-footer">
                                <span class="archive-category">${post.category}</span>
                                <div class="archive-tags">
                                    ${post.tags.map(t => `<span class="archive-tag">${t}</span>`).join('')}
                                </div>
                            </div>
                        </article>
                    `;
                });
                html += `
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            initScrollObserver();
        }
        renderArchive();
        let currentDate = new Date();
        function renderCalendar(date) {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('calendarTitle');
            const year = date.getFullYear(), month = date.getMonth();
            title.textContent = year + '年' + (month+1) + '月';
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month+1, 0).getDate();
            const daysInPrev = new Date(year, month, 0).getDate();
            const dayNames = ['日','一','二','三','四','五','六'];
            let html = dayNames.map(d => '<div class="day-name">'+d+'</div>').join('');
            for (let i = firstDay-1; i >= 0; i--) html += '<div class="day other-month">'+(daysInPrev-i)+'</div>';
            const today = new Date();
            const postDays = [3,7,12,15,16,17,21,25,28,31];
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = (d===today.getDate() && month===today.getMonth() && year===today.getFullYear());
                const hasPost = postDays.includes(d);
                let cls = 'day';
                if (isToday) cls += ' today';
                if (hasPost) cls += ' has-post';
                html += '<div class="'+cls+'">'+d+'</div>';
            }
            const remaining = 42 - (firstDay + daysInMonth);
            for (let i = 1; i <= remaining; i++) html += '<div class="day other-month">'+i+'</div>';
            grid.innerHTML = html;
        }
        document.getElementById('prevMonth').addEventListener('click', function(){ currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(currentDate); });
        document.getElementById('nextMonth').addEventListener('click', function(){ currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(currentDate); });
        renderCalendar(currentDate);
        const themeToggle = document.getElementById('themeToggle');
		const html = document.documentElement;
		const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        const sunSVG = `<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>`;
        const moonSVG = `<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>`;
        themeToggle.innerHTML = savedTheme === 'dark' ? sunSVG : moonSVG;
        themeToggle.addEventListener('click', () => {
          const current = html.getAttribute('data-theme');
          const next = current === 'dark' ? 'light' : 'dark';
          html.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          themeToggle.innerHTML = next === 'dark' ? sunSVG : moonSVG;
        });
        window.addEventListener('scroll', function(){
            const header = document.getElementById('header');
            const backToTop = document.getElementById('backToTop');
            if (window.scrollY > 50) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
            if (window.scrollY > 400) backToTop.classList.add('visible');
            else backToTop.classList.remove('visible');
        });
        document.getElementById('backToTop').addEventListener('click', function(){
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        function initScrollObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.fade-in:not(.visible)').forEach(el => observer.observe(el));
        }
        initScrollObserver();
        const startTime = new Date('2026-08-21T22:14:00').getTime();
        function updateUptime() {
            const timerEl = document.getElementById('uptime-timer');
            if (!timerEl) return;
            const now = new Date().getTime();
            const diff = now - startTime;
            if (diff < 0) {
                timerEl.textContent = "尚未开始运营";
                return;
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            timerEl.textContent = days + ' 天 ' + hours + ' 时 ' + minutes + ' 分 ' + seconds + ' 秒';
        }
        updateUptime();
        function animateNumber(id, target, formatter) {
            const el = document.getElementById(id);
            if (!el) return;
            if (typeof target === 'string') { el.textContent = target; return; }
            const start = 0;
            const duration = 1200;
            const startTime2 = performance.now();
            function update(currentTime) {
                const elapsed = currentTime - startTime2;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(start + (target - start) * eased);
                el.textContent = formatter ? formatter(current) : current;
                if (progress < 1) requestAnimationFrame(update);
                else el.textContent = formatter ? formatter(target) : target;
            }
            requestAnimationFrame(update);
        }
        function updateStats() {
            const articleCount = posts.length;
            let totalChars = 0;
            posts.forEach(post => { totalChars += post.title.length + post.excerpt.length; });
            const now = Date.now();
            const diff = now - siteStartTime;
            const uptimeStr = formatUptime(diff);
            let views = parseInt(localStorage.getItem('blog_page_views'));
            if (isNaN(views)) { views = 1; localStorage.setItem('blog_page_views', '1'); }
            else { views++; localStorage.setItem('blog_page_views', views.toString()); }
            animateNumber('stat-articles', articleCount);
            animateNumber('stat-chars', totalChars, formatChars);
            document.getElementById('stat-uptime').textContent = uptimeStr;
            animateNumber('stat-views', views);
        }
        updateStats();
    </script>
